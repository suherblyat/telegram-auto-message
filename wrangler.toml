name = "telegram-auto-message2"
main = "src/control-ban-router.js"
compatibility_date = "2025-01-01"

[vars]
OWNER_USER_ID = "2073293508"
MOD_CHAT_ID = "-1001861714695"
SUMMARY_CHAT_IDS = "-1001861714695,-1003697946094"
BOT_USERNAME = "ced_podestnik_bot"

[[kv_namespaces]]
binding = "MOD_STATE"
id = "ca99f7dd3cb94c608f321315d9022c0d"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "OWNER_TIMERS"
class_name = "OwnerTimer"

[[migrations]]
tag = "owner-timers-v1"
new_sqlite_classes = ["OwnerTimer"]



[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "CHAT_SUMMARIES"
class_name = "ChatSummary"

[[migrations]]
tag = "chat-summaries-v1"
new_sqlite_classes = ["ChatSummary"]
